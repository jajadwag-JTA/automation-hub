name: hub
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      retries: 10
  hub:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HUB_DATABASE_URL: postgres://hub:${POSTGRES_PASSWORD}@postgres:5432/hub?sslmode=disable
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./projects:/projects:ro
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres-data:
