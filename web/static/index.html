<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automation Hub</title>
<style>
:root{--bg:#f6f7f9;--panel:#ffffff;--text:#1b1f24;--muted:#5d6672;--line:#dfe3e8;--accent:#2557d6;--ok:#1a7f4b;--warn:#a15c00}
@media (prefers-color-scheme: dark){:root{--bg:#14171b;--panel:#1c2026;--text:#e8eaed;--muted:#9aa4b0;--line:#2c323a;--accent:#7aa2ff;--ok:#5fd08f;--warn:#e0a458}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:baseline;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{margin:0;font-size:18px}
h2{margin:0 0 4px;font-size:22px}
h3{margin:24px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
main{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px 24px;max-width:1200px;margin:0 auto}
@media (max-width:800px){main{grid-template-columns:1fr;padding:12px}}
aside,#detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.controls{display:flex;gap:8px;margin-bottom:10px}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input{flex:1;min-width:0}
ul{list-style:none;margin:0;padding:0}
.item{display:block;padding:10px;border-radius:8px;color:inherit;text-decoration:none;border:1px solid transparent}
.item:hover{background:var(--bg)}
.item.active{border-color:var(--accent);background:var(--bg)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:10px}
.badge{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge[data-status=live]{color:var(--ok);border-color:var(--ok)}
.badge[data-status=building],.badge[data-status=idea]{color:var(--accent);border-color:var(--accent)}
.badge[data-status=paused]{color:var(--warn);border-color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.meta{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;margin:12px 0 0}
.meta dt{color:var(--muted)}.meta dd{margin:0}
a{color:var(--accent)}
.flow{display:flex;flex-direction:column;align-items:stretch;max-width:520px}
.node{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.node.trigger{border-color:var(--accent)}
.arrow{text-align:center;color:var(--muted);line-height:1.6}
pre{white-space:pre-wrap;word-wrap:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.5 ui-monospace,Consolas,monospace;margin:0}
#error{margin:12px 24px;padding:10px 14px;border-radius:8px;border:1px solid var(--warn);color:var(--warn);background:var(--panel)}
</style>
</head>
<body>
<header><h1>Automation Hub</h1><span id="count" class="muted small"></span></header>
<div id="error" hidden></div>
<main>
  <aside>
    <div class="controls">
      <input id="q" type="search" placeholder="Search projects" aria-label="Search projects">
      <select id="status" aria-label="Filter by status">
        <option value="">All</option>
        <option>idea</option><option>building</option><option>live</option><option>paused</option><option>retired</option>
      </select>
    </div>
    <ul id="list"></ul>
  </aside>
  <section id="detail"><p class="muted">Select a project.</p></section>
</main>
<script>
const $ = (s) => document.querySelector(s);
let projects = [];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

function badge(text, status) {
  const b = el("span", "badge", text);
  if (status) b.dataset.status = status;
  return b;
}

async function getJSON(url) {
  const r = await fetch(url);
  let body = null;
  try { body = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((body && body.error) || r.statusText);
  return body;
}

function currentSlug() {
  try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ""; }
}

function renderList() {
  const q = $("#q").value.trim().toLowerCase();
  const st = $("#status").value;
  const ul = $("#list");
  ul.replaceChildren();
  const shown = projects.filter((p) => {
    if (st && p.status !== st) return false;
    if (!q) return true;
    return [p.title, p.about, p.slug, (p.tags || []).join(" ")].join(" ").toLowerCase().includes(q);
  });
  $("#count").textContent = shown.length + " of " + projects.length + " projects";
  if (!shown.length) { ul.append(el("li", "muted empty", "No projects match.")); return; }
  const current = currentSlug();
  for (const p of shown) {
    const li = el("li");
    const a = el("a", "item");
    a.href = "#" + encodeURIComponent(p.slug);
    if (p.slug === current) a.classList.add("active");
    const top = el("div", "row");
    top.append(el("strong", null, p.title), badge(p.status, p.status));
    a.append(top, el("div", "muted small", p.about));
    li.append(a);
    ul.append(li);
  }
}

function renderWorkflow(w) {
  const box = el("div", "flow");
  const t = el("div", "node trigger");
  t.append(el("div", "small muted", "Trigger"), el("strong", null, w.trigger.type + (w.trigger.spec ? "  " + w.trigger.spec : "")));
  box.append(t);
  const names = {};
  for (const s of w.steps || []) names[s.id] = s.name;
  for (const s of w.steps || []) {
    box.append(el("div", "arrow", "\u2193"));
    const n = el("div", "node");
    const head = el("div", "row");
    head.append(el("strong", null, s.name), badge(s.type));
    n.append(head, el("div", "muted small", s.system));
    if (s.notes) n.append(el("div", "small", s.notes));
    const next = s.next && s.next.length ? "Next: " + s.next.map((id) => names[id] || id).join(", ") : "End of flow";
    n.append(el("div", "small muted", next));
    box.append(n);
  }
  if (w.outputs && w.outputs.length) {
    box.append(el("div", "arrow", "\u2193"));
    const o = el("div", "node");
    o.append(el("div", "small muted", "Outputs"));
    const chips = el("div", "chips");
    for (const x of w.outputs) chips.append(el("span", "chip", x));
    o.append(chips);
    box.append(o);
  }
  return box;
}

function section(title, node) {
  const s = el("div");
  s.append(el("h3", null, title), node);
  return s;
}

async function showProject(slug) {
  const d = $("#detail");
  if (!slug) { d.replaceChildren(el("p", "muted", "Select a project.")); return; }
  try {
    const p = await getJSON("/api/projects/" + encodeURIComponent(slug));
    const head = el("div", "row");
    head.append(el("h2", null, p.title), el("div", "chips"));
    head.lastChild.append(badge(p.status, p.status), badge(p.kind));
    const meta = el("dl", "meta");
    meta.append(el("dt", null, "Owner"), el("dd", null, p.owner || "-"));
    const tags = el("div", "chips");
    for (const x of p.tags || []) tags.append(el("span", "chip", x));
    const tagsDd = el("dd");
    tagsDd.append(tags);
    meta.append(el("dt", null, "Tags"), tagsDd);
    const linksDd = el("dd");
    for (const [name, url] of Object.entries(p.links || {})) {
      if (/^https?:\/\//.test(url)) {
        const a = el("a", null, name);
        a.href = url; a.target = "_blank"; a.rel = "noopener";
        linksDd.append(a, document.createTextNode("  "));
      } else {
        linksDd.append(el("span", null, name + ": " + url + "  "));
      }
    }
    if (!linksDd.childNodes.length) linksDd.textContent = "-";
    meta.append(el("dt", null, "Links"), linksDd);

    const parts = [head, el("p", "muted", p.about), meta];
    if (p.workflow) parts.push(section("Workflow", renderWorkflow(p.workflow)));
    if (p.readme) parts.push(section("Notes", el("pre", null, p.readme)));
    d.replaceChildren(...parts);
  } catch (e) {
    d.replaceChildren(el("p", "muted", "Could not load this project: " + e.message));
  }
}

async function init() {
  try {
    projects = await getJSON("/api/projects");
  } catch (e) {
    const b = $("#error");
    b.textContent = "Could not load projects: " + e.message;
    b.hidden = false;
    return;
  }
  renderList();
  showProject(currentSlug());
}

window.addEventListener("hashchange", () => { renderList(); showProject(currentSlug()); });
$("#q").addEventListener("input", renderList);
$("#status").addEventListener("change", renderList);
init();
</script>
</body>
</html>
